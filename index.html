<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projeto CI/CD - Front</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">

    <header class="topo">
      <h1 class="titulo">🌐 Integração Front → API Render</h1>
      <p class="subtitulo">
        Interface simples para testar a API publicada no Render usando <code>fetch()</code>.
      </p>
    </header>

    <section class="painel">
      <div class="campo">
        <label for="apiUrl">URL da API:</label>
        <input id="apiUrl" type="url" placeholder="https://seu-back.onrender.com" />
      </div>

      <button id="btnChamar" class="botao">Testar API</button>

      <pre id="saida" class="terminal">
Clique no botão para iniciar a requisição…
      </pre>
    </section>

    <footer class="rodape">
      <small>🚀 Pipeline CI/CD · Deploy Automático na Vercel</small>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
